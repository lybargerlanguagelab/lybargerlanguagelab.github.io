<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="531" viewBox="0 0 1328 531" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0e6473"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5b6770"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1328" height="531" fill="#ffffff"/>

  <!-- header line -->
  <text x="18" y="30" font-size="21" font-weight="bold" fill="#0e6473">DEMI  ·  Direct Effects Multiplicative Inference</text>
  <text x="1310" y="30" font-size="15" fill="#5b6770" text-anchor="end">Causal prediction from pairwise clinical relationships</text>

  <!-- ================= Box 1: Knowledgebase ================= -->
  <g>
    <rect x="16" y="48" width="252" height="368" rx="8" fill="#ffffff" stroke="#b7c0c6" stroke-width="1.5"/>
    <circle cx="40" cy="74" r="13" fill="#0e6473"/>
    <text x="40" y="79" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="60" y="79" font-size="16" font-weight="bold" fill="#0e6473">Start from pairs</text>
    <!-- mini concept network -->
    <g font-size="12.5">
      <circle cx="70" cy="150" r="26" fill="#eef4f5" stroke="#0e6473" stroke-width="1.5"/>
      <text x="70" y="147" text-anchor="middle" fill="#1a1a1a">depres-</text>
      <text x="70" y="161" text-anchor="middle" fill="#1a1a1a">sion</text>
      <circle cx="196" cy="132" r="26" fill="#eef4f5" stroke="#0e6473" stroke-width="1.5"/>
      <text x="196" y="129" text-anchor="middle" fill="#1a1a1a">medi-</text>
      <text x="196" y="143" text-anchor="middle" fill="#1a1a1a">cation</text>
      <circle cx="150" cy="222" r="26" fill="#eef4f5" stroke="#0e6473" stroke-width="1.5"/>
      <text x="150" y="219" text-anchor="middle" fill="#1a1a1a">anx-</text>
      <text x="150" y="233" text-anchor="middle" fill="#1a1a1a">iety</text>
      <line x1="95" y1="143" x2="169" y2="134" stroke="#9aa5ad" stroke-width="2"/>
      <line x1="88" y1="167" x2="128" y2="205" stroke="#9aa5ad" stroke-width="2"/>
      <line x1="176" y1="151" x2="162" y2="198" stroke="#9aa5ad" stroke-width="2"/>
    </g>
    <text x="30" y="284" font-size="13.5" fill="#33393e">How often two clinical events</text>
    <text x="30" y="301" font-size="13.5" fill="#33393e">occur in the same patient, and</text>
    <text x="30" y="318" font-size="13.5" fill="#33393e">which comes first: counts from</text>
    <text x="30" y="335" font-size="13.5" fill="#33393e">358,082 patients.</text>
    <text x="30" y="368" font-size="13.5" font-weight="bold" fill="#0e6473">No individual patient</text>
    <text x="30" y="385" font-size="13.5" font-weight="bold" fill="#0e6473">records needed.</text>
  </g>
  <line x1="272" y1="232" x2="296" y2="232" stroke="#0e6473" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ================= Box 2: Order in time ================= -->
  <g>
    <rect x="300" y="48" width="240" height="368" rx="8" fill="#ffffff" stroke="#b7c0c6" stroke-width="1.5"/>
    <circle cx="324" cy="74" r="13" fill="#0e6473"/>
    <text x="324" y="79" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="344" y="79" font-size="16" font-weight="bold" fill="#0e6473">Order events in time</text>
    <g font-size="13">
      <rect x="366" y="112" width="108" height="28" rx="14" fill="#eef4f5" stroke="#0e6473"/>
      <text x="420" y="130" text-anchor="middle" fill="#1a1a1a">anxiety</text>
      <line x1="420" y1="142" x2="420" y2="154" stroke="#5b6770" stroke-width="2" marker-end="url(#arrg)"/>
      <rect x="322" y="158" width="196" height="28" rx="14" fill="#eef4f5" stroke="#0e6473"/>
      <text x="420" y="176" text-anchor="middle" fill="#1a1a1a">citalopram, no response</text>
      <line x1="420" y1="188" x2="420" y2="200" stroke="#5b6770" stroke-width="2" marker-end="url(#arrg)"/>
      <rect x="330" y="204" width="180" height="28" rx="14" fill="#eef4f5" stroke="#0e6473"/>
      <text x="420" y="222" text-anchor="middle" fill="#1a1a1a">depression diagnosis</text>
      <line x1="420" y1="234" x2="420" y2="246" stroke="#5b6770" stroke-width="2" marker-end="url(#arrg)"/>
      <rect x="330" y="250" width="180" height="28" rx="14" fill="#eef4f5" stroke="#0e6473"/>
      <text x="420" y="268" text-anchor="middle" fill="#1a1a1a">response, or not</text>
    </g>
    <text x="314" y="312" font-size="13.5" fill="#33393e">The data itself says what tends</text>
    <text x="314" y="329" font-size="13.5" fill="#33393e">to happen before what. No</text>
    <text x="314" y="346" font-size="13.5" fill="#33393e">ordering is assumed or chosen</text>
    <text x="314" y="363" font-size="13.5" fill="#33393e">by the analyst.</text>
  </g>
  <line x1="544" y1="232" x2="568" y2="232" stroke="#0e6473" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ================= Box 3: Keep direct effects ================= -->
  <g>
    <rect x="572" y="48" width="240" height="368" rx="8" fill="#ffffff" stroke="#b7c0c6" stroke-width="1.5"/>
    <circle cx="596" cy="74" r="13" fill="#0e6473"/>
    <text x="596" y="79" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="616" y="79" font-size="16" font-weight="bold" fill="#0e6473">Keep direct effects</text>
    <g>
      <text x="700" y="116" font-size="12" fill="#5b6770" text-anchor="middle">indirect (removed)</text>
      <circle cx="626" cy="184" r="24" fill="#eef4f5" stroke="#0e6473" stroke-width="1.5"/>
      <text x="626" y="188" font-size="12" text-anchor="middle" fill="#1a1a1a">anxiety</text>
      <circle cx="716" cy="148" r="24" fill="#ffffff" stroke="#9aa5ad" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="716" y="145" font-size="12" text-anchor="middle" fill="#5b6770">depres-</text>
      <text x="716" y="158" font-size="12" text-anchor="middle" fill="#5b6770">sion</text>
      <circle cx="776" cy="212" r="24" fill="#eef4f5" stroke="#0e6473" stroke-width="1.5"/>
      <text x="776" y="209" font-size="12" text-anchor="middle" fill="#1a1a1a">res-</text>
      <text x="776" y="222" font-size="12" text-anchor="middle" fill="#1a1a1a">ponse</text>
      <line x1="648" y1="174" x2="694" y2="156" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
      <line x1="734" y1="159" x2="762" y2="194" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
      <line x1="649" y1="192" x2="752" y2="209" stroke="#0e6473" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="688" y="230" font-size="12" fill="#0e6473" font-weight="bold">direct</text>
    </g>
    <text x="586" y="290" font-size="13.5" fill="#33393e">How much does each factor</text>
    <text x="586" y="307" font-size="13.5" fill="#33393e">predict response on its own,</text>
    <text x="586" y="324" font-size="13.5" fill="#33393e">and how much only through the</text>
    <text x="586" y="341" font-size="13.5" fill="#33393e">later events it travels with?</text>
    <text x="586" y="358" font-size="13.5" fill="#33393e">Related factors are not</text>
    <text x="586" y="375" font-size="13.5" fill="#33393e">counted twice.</text>
  </g>
  <line x1="816" y1="232" x2="840" y2="232" stroke="#0e6473" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ================= Box 4: Combine ================= -->
  <g>
    <rect x="844" y="48" width="240" height="368" rx="8" fill="#ffffff" stroke="#b7c0c6" stroke-width="1.5"/>
    <circle cx="868" cy="74" r="13" fill="#0e6473"/>
    <text x="868" y="79" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="886" y="79" font-size="16" font-weight="bold" fill="#0e6473">Combine what is known</text>
    <!-- stacked chips multiply -->
    <g font-size="13">
      <rect x="880" y="116" width="170" height="26" rx="13" fill="#eef4f5" stroke="#0e6473"/>
      <text x="965" y="133" text-anchor="middle" fill="#1a1a1a">anxiety history</text>
      <text x="965" y="158" font-size="15" text-anchor="middle" fill="#5b6770">×</text>
      <rect x="880" y="166" width="170" height="26" rx="13" fill="#eef4f5" stroke="#0e6473"/>
      <text x="965" y="183" text-anchor="middle" fill="#1a1a1a">prior citalopram trial</text>
      <text x="965" y="208" font-size="15" text-anchor="middle" fill="#5b6770">×</text>
      <rect x="880" y="216" width="170" height="26" rx="13" fill="#eef4f5" stroke="#0e6473"/>
      <text x="965" y="233" text-anchor="middle" fill="#1a1a1a">depression history</text>
    </g>
    <text x="858" y="286" font-size="13.5" fill="#33393e">Multiply the direct effects of the</text>
    <text x="858" y="303" font-size="13.5" fill="#33393e">features the patient actually has.</text>
    <text x="858" y="332" font-size="13.5" font-weight="bold" fill="#0e6473">A partial record, as in an</text>
    <text x="858" y="349" font-size="13.5" font-weight="bold" fill="#0e6473">intake conversation, can still</text>
    <text x="858" y="366" font-size="13.5" font-weight="bold" fill="#0e6473">be scored. No imputation.</text>
  </g>
  <line x1="1088" y1="232" x2="1112" y2="232" stroke="#0e6473" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ================= Box 5: Output ================= -->
  <g>
    <rect x="1116" y="48" width="196" height="368" rx="8" fill="#e9f3f4" stroke="#0e6473" stroke-width="2"/>
    <text x="1214" y="82" font-size="16" font-weight="bold" fill="#0e6473" text-anchor="middle">Prediction</text>
    <circle cx="1214" cy="140" r="24" fill="#ffffff" stroke="#0e6473" stroke-width="2"/>
    <circle cx="1214" cy="132" r="8" fill="#0e6473"/>
    <path d="M 1200 152 a 14 12 0 0 1 28 0 z" fill="#0e6473"/>
    <text x="1214" y="196" font-size="13.5" fill="#33393e" text-anchor="middle">Chance this patient</text>
    <text x="1214" y="213" font-size="13.5" fill="#33393e" text-anchor="middle">responds to</text>
    <text x="1214" y="230" font-size="13.5" fill="#33393e" text-anchor="middle">sertraline</text>
    <!-- probability bar -->
    <text x="1214" y="272" font-size="26" font-weight="bold" fill="#0e6473" text-anchor="middle">18%</text>
    <rect x="1140" y="286" width="148" height="18" rx="9" fill="#ffffff" stroke="#9aa5ad"/>
    <rect x="1140" y="286" width="27" height="18" rx="9" fill="#0e6473"/>
    <text x="1140" y="322" font-size="12.5" fill="#5b6770" text-anchor="start">0%</text>
    <text x="1288" y="322" font-size="12.5" fill="#5b6770" text-anchor="end">100%</text>
    <text x="1214" y="356" font-size="13.5" font-weight="bold" fill="#0e6473" text-anchor="middle">The same knowledgebase</text>
    <text x="1214" y="373" font-size="13.5" font-weight="bold" fill="#0e6473" text-anchor="middle">supports any outcome</text>
    <text x="1214" y="390" font-size="13.5" font-weight="bold" fill="#0e6473" text-anchor="middle">recorded in the data.</text>
  </g>

  <!-- ================= Footer result band ================= -->
  <rect x="16" y="442" width="1296" height="66" rx="8" fill="#f2f5f6"/>
  <text x="664" y="470" font-size="17" fill="#1a1a1a" text-anchor="middle">Across 15 antidepressant-response prediction tasks, DEMI matched logistic regression trained on complete patient-level data:</text>
  <text x="664" y="495" font-size="17" font-weight="bold" fill="#0e6473" text-anchor="middle">mean AUC 0.934 vs 0.935, not significantly different, from pairwise counts alone.</text>
</svg>
