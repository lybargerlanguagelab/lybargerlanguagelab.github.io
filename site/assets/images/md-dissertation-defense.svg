<!-- News figure: Md's dissertation defense, 2026-10-28. Four panels, one per
     chapter, in a two-by-two grid: the top row is accessibility, the bottom
     row is safety; the left column evaluates, the right column improves.
     Top left: the same health question phrased three ways, each outlined
     bubble with a shrinking answer-quality bar beside it (Chapter 3, style
     perturbation). Top right: a dense block of thin lines becoming a short
     block of plain thick lines (Chapter 2, simplification). Bottom left:
     a multi-turn attack thread with a traceback loop reaching a gold-rimmed
     shield (Chapter 4, ATTCK-R). Bottom right: a system-prompt card whose
     policy block swaps, feeding the same shield (Chapter 5, policy-swap
     DPO). Same vocabulary as the home hero, the Projects figures, and the
     ATTCK-R news figure. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Illustration in four panels: one question phrased three ways with a shrinking quality bar beside each; dense text becoming plain text; a multi-turn attack thread looping back on itself and reaching a gold-rimmed shield; and a prompt card whose policy block swaps, feeding the same shield" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4d8f6a"/>
    </marker>
    <path id="shield" d="M0 -34 L22 -24 V2 C22 20 11 34 0 40 C-11 34 -22 20 -22 2 V-24 Z"/>
  </defs>
  <rect width="320" height="240" rx="10" fill="#f4f7f5"/>

  <!-- grid rules -->
  <path d="M160 14 V226 M14 120 H306" fill="none" stroke="#d9e3dc" stroke-width="2"/>

  <!-- top left: one question, three phrasings, answer quality falling -->
  <g>
    <rect x="22" y="22" width="82" height="20" rx="10" fill="#ffffff" stroke="#4d8f6a" stroke-width="2.5"/>
    <rect x="34" y="29" width="48" height="6" rx="3" fill="#a3c4b0"/>
    <rect x="112" y="24" width="30" height="16" rx="3" fill="#006633"/>

    <rect x="22" y="50" width="82" height="20" rx="10" fill="#ffffff" stroke="#4d8f6a" stroke-width="2.5"/>
    <rect x="34" y="57" width="30" height="6" rx="3" fill="#a3c4b0"/>
    <rect x="72" y="57" width="20" height="6" rx="3" fill="#a3c4b0"/>
    <rect x="112" y="52" width="20" height="16" rx="3" fill="#4d8f6a"/>

    <rect x="22" y="78" width="82" height="20" rx="10" fill="#ffffff" stroke="#4d8f6a" stroke-width="2.5"/>
    <rect x="34" y="85" width="16" height="6" rx="3" fill="#a3c4b0"/>
    <rect x="56" y="85" width="12" height="6" rx="3" fill="#a3c4b0"/>
    <rect x="74" y="85" width="18" height="6" rx="3" fill="#a3c4b0"/>
    <rect x="112" y="80" width="10" height="16" rx="3" fill="#a3c4b0"/>
  </g>

  <!-- top right: dense text becomes plain text -->
  <g>
    <rect x="176" y="22" width="58" height="76" rx="6" fill="#ffffff" stroke="#4d8f6a" stroke-width="2.5"/>
    <rect x="184" y="32" width="42" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="184" y="41" width="38" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="184" y="50" width="42" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="184" y="59" width="34" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="184" y="68" width="42" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="184" y="77" width="40" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="184" y="86" width="24" height="4" rx="2" fill="#a3c4b0"/>

    <path d="M240 60 H254" fill="none" stroke="#4d8f6a" stroke-width="2.5" marker-end="url(#head)"/>

    <rect x="262" y="34" width="44" height="52" rx="6" fill="#006633"/>
    <rect x="270" y="46" width="28" height="7" rx="3.5" fill="#ffffff" opacity="0.85"/>
    <rect x="270" y="60" width="22" height="7" rx="3.5" fill="#ffffff" opacity="0.85"/>
    <rect x="270" y="74" width="16" height="7" rx="3.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- bottom left: multi-turn attack thread with traceback, reaching the protected model -->
  <g>
    <rect x="24" y="134" width="64" height="16" rx="8" fill="#006633"/>
    <rect x="34" y="140" width="40" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="42" y="156" width="64" height="16" rx="8" fill="#ffffff" stroke="#4d8f6a" stroke-width="2.5"/>
    <rect x="52" y="162" width="32" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="24" y="178" width="64" height="16" rx="8" fill="#006633"/>
    <rect x="34" y="184" width="46" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="42" y="200" width="64" height="16" rx="8" fill="#ffffff" stroke="#4d8f6a" stroke-width="2.5"/>
    <rect x="52" y="206" width="26" height="4" rx="2" fill="#a3c4b0"/>
    <path d="M20 186 C6 186 6 142 20 142" fill="none" stroke="#4d8f6a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#head)"/>
    <path d="M110 176 H120" fill="none" stroke="#4d8f6a" stroke-width="2.5" marker-end="url(#head)"/>
    <g transform="translate(140 176)">
      <use href="#shield" fill="#006633" stroke="#ffcc33" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-8 -4 L8 -4 L0 14 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="-8" cy="-4" r="3.5" fill="#ffffff"/>
      <circle cx="8" cy="-4" r="3.5" fill="#ffffff"/>
      <circle cx="0" cy="14" r="3.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- bottom right: prompt card with a swapping policy block, feeding the protected model -->
  <g>
    <rect x="174" y="134" width="56" height="84" rx="6" fill="#ffffff" stroke="#4d8f6a" stroke-width="2.5"/>
    <rect x="182" y="142" width="40" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="182" y="150" width="30" height="4" rx="2" fill="#a3c4b0"/>
    <rect x="182" y="162" width="40" height="20" rx="4" fill="#006633"/>
    <rect x="190" y="170" width="24" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="182" y="190" width="40" height="20" rx="4" fill="#ffffff" stroke="#4d8f6a" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="190" y="198" width="20" height="4" rx="2" fill="#a3c4b0"/>
    <!-- swap: two half-circle arrows chasing each other -->
    <path d="M234.5 182.9 A8 8 0 0 1 249.5 182.9" fill="none" stroke="#4d8f6a" stroke-width="2.5" marker-end="url(#head)"/>
    <path d="M249.5 189.1 A8 8 0 0 1 234.5 189.1" fill="none" stroke="#4d8f6a" stroke-width="2.5" marker-end="url(#head)"/>
    <path d="M256 186 H264" fill="none" stroke="#4d8f6a" stroke-width="2.5" marker-end="url(#head)"/>
    <g transform="translate(290 176)">
      <use href="#shield" fill="#006633" stroke="#ffcc33" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-8 -4 L8 -4 L0 14 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="-8" cy="-4" r="3.5" fill="#ffffff"/>
      <circle cx="8" cy="-4" r="3.5" fill="#ffffff"/>
      <circle cx="0" cy="14" r="3.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
