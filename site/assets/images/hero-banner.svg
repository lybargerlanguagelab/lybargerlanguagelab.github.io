<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Abstract illustration: conversation becomes a language signal, then structured health information">
  <rect width="1200" height="300" rx="12" fill="#f4f7f5"/>

  <!-- conversation -->
  <g>
    <rect x="80" y="72" width="210" height="72" rx="16" fill="#006633"/>
    <path d="M110 144 l-14 24 34 -24 z" fill="#006633"/>
    <rect x="102" y="94" width="140" height="9" rx="4.5" fill="#ffffff" opacity="0.85"/>
    <rect x="102" y="113" width="96" height="9" rx="4.5" fill="#ffffff" opacity="0.6"/>

    <rect x="140" y="176" width="185" height="62" rx="16" fill="#ffffff" stroke="#4d8f6a" stroke-width="2"/>
    <path d="M296 238 l12 20 -30 -20 z" fill="#ffffff" stroke="#4d8f6a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="160" y="194" width="120" height="8" rx="4" fill="#a3c4b0"/>
    <rect x="160" y="211" width="82" height="8" rx="4" fill="#c9d8ce"/>
  </g>

  <!-- language signal -->
  <g fill="none" stroke-linecap="round">
    <path d="M370 155 c 20 -50 40 -50 60 0 s 40 50 60 0 s 40 -50 60 0 s 40 50 60 0"
          stroke="#006633" stroke-width="4"/>
    <path d="M370 165 c 20 30 40 30 60 0 s 40 -30 60 0 s 40 30 60 0 s 40 -30 60 0"
          stroke="#a3c4b0" stroke-width="3"/>
  </g>
  <circle cx="352" cy="158" r="6" fill="#ffcc33"/>

  <!-- tokens -->
  <g fill="#4d8f6a">
    <rect x="640" y="150" width="26" height="10" rx="5"/>
    <rect x="674" y="150" width="16" height="10" rx="5"/>
    <rect x="698" y="150" width="30" height="10" rx="5"/>
  </g>
  <circle cx="745" cy="155" r="6" fill="#ffcc33"/>

  <!-- structured record -->
  <g>
    <rect x="790" y="58" width="330" height="184" rx="12" fill="#ffffff" stroke="#dfe5e1" stroke-width="2"/>
    <rect x="790" y="58" width="330" height="34" rx="12" fill="#eef3ef"/>
    <rect x="790" y="80" width="330" height="12" fill="#eef3ef"/>
    <circle cx="812" cy="75" r="5" fill="#c9d8ce"/>
    <circle cx="830" cy="75" r="5" fill="#c9d8ce"/>

    <rect x="812" y="110" width="64" height="14" rx="7" fill="#006633"/>
    <rect x="888" y="112" width="200" height="10" rx="5" fill="#dfe5e1"/>

    <rect x="812" y="140" width="64" height="14" rx="7" fill="#4d8f6a"/>
    <rect x="888" y="142" width="164" height="10" rx="5" fill="#dfe5e1"/>

    <rect x="812" y="170" width="64" height="14" rx="7" fill="#ffcc33"/>
    <rect x="888" y="172" width="186" height="10" rx="5" fill="#dfe5e1"/>

    <rect x="812" y="200" width="64" height="14" rx="7" fill="#a3c4b0"/>
    <rect x="888" y="202" width="140" height="10" rx="5" fill="#dfe5e1"/>
  </g>
</svg>
